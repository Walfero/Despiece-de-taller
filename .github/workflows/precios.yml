name: Recordatorio de precios

on:
  schedule:
    # Lunes a las 06:23 UTC (07:23 en Madrid en invierno, 08:23 en verano)
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests==2.32.3

      - name: Mandar recordatorio
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EDIT_URL: https://github.com/${{ github.repository }}/edit/${{ github.event.repository.default_branch }}/prices.json
        run: python scripts/recordatorio_precios.py

