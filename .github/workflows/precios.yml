name: Comprobar precios

on:
  schedule:
    # Lunes a las 06:23 UTC (07:23 en Madrid en invierno, 08:23 en verano)
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests==2.32.3

      - name: Comprobar precios
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/update_prices.py

      - name: Guardar precios nuevos
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "precios-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prices.json history.csv
            git commit -m "Precios $(date -u +%F)"
            git push
          else
            echo "Nada que guardar"
          fi
